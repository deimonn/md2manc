name: Build
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/build.yml'
      - 'docs/**'
      - 'src/**'
      - 'tests/**'
      - 'generate_named_entities.py'
      - 'meson.build'
  push:
    branches:
      - '*'
    paths:
      - '.github/workflows/build.yml'
      - 'docs/**'
      - 'src/**'
      - 'tests/**'
      - 'generate_named_entities.py'
      - 'meson.build'
  release:
    types: ['published']
jobs:
  build:
    name: Build
    permissions:
      contents: "write"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            label: linux-x64
            shell: sh
            deps: sudo apt install -y meson libmd4c-dev

          - os: ubuntu-26.04-arm
            label: linux-arm64
            shell: sh
            deps: sudo apt install -y meson libmd4c-dev

          - os: macos-26-intel
            label: macos-x64
            shell: sh
            deps: brew install meson md4c

          - os: macos-26
            label: macos-arm64
            shell: sh
            deps: brew install meson md4c

          - os: windows-2025
            label: windows-x64
            shell: msys2 {0}
            msystem: UCRT64
            deps: 'base-devel: git github-cli gcc meson md4c'

          - os: windows-11-arm
            label: windows-arm64
            shell: msys2 {0}
            msystem: CLANGARM64
            deps: 'base-devel: git github-cli gcc meson md4c'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Setup environment
        if: ${{ startsWith(matrix.os, 'windows-') }}
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          pacboy: ${{ matrix.deps }}

      - name: Checkout
        uses: actions/checkout@v7

      - name: Fetch dependencies
        if: ${{ ! startsWith(matrix.os, 'windows-') }}
        run: ${{ matrix.deps }}

      - name: Configure
        run: meson setup builddir -Dbuildtype=debugoptimized -Dprefix=/

      - name: Build
        run: ninja -C builddir

      - name: Test
        run: ninja test -C builddir

      - name: Install
        run: DESTDIR="$(pwd)/builddir/package/md2manc" ninja install -C builddir

      - name: Copy license
        run: cp LICENSE builddir/package/md2manc

      - name: Copy dependencies
        if: ${{ startsWith(matrix.os, 'windows-') }}
        run: |
          cp /${{ matrix.msystem }}/bin/libmd4c.dll builddir/package/md2manc/bin &&
          mkdir -p builddir/package/md2manc/licenses &&
          cp -r /${{ matrix.msystem }}/share/licenses/md4c builddir/package/md2manc/licenses

      - name: Package
        run: tar -C builddir/package -vacf md2manc-${{ matrix.label }}.tar.gz md2manc

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          path: md2manc-${{ matrix.label }}.tar.gz
          archive: false

      - name: Upload release
        run: gh release upload ${{ github.ref_name }} md2manc-${{ matrix.label }}.tar.gz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: github.event_name == 'release'
